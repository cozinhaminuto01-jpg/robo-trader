<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Conversa com a IA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1419;
            color: #e6e6e6;
            padding-bottom: 40px;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        header .titulo {
            font-size: 17px;
            font-weight: 600;
        }

        header .saldo {
            font-size: 15px;
            font-weight: 600;
            background: rgba(255,255,255,0.15);
            padding: 4px 10px;
            border-radius: 12px;
        }

        .status {
            text-align: center;
            font-size: 12px;
            color: #8a8f98;
            padding: 8px 16px;
            border-bottom: 1px solid #232830;
        }

        .feed {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ciclo {
            background: #1a1f26;
            border: 1px solid #262c35;
            border-radius: 14px;
            padding: 14px 16px;
        }

        .ciclo-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
            font-size: 12px;
            color: #8a8f98;
        }

        .ciclo-header .n {
            color: #a6b1ff;
            font-weight: 600;
        }

        .pensamento {
            font-size: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #d8dce3;
        }

        .decisao {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #262c35;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .badge {
            font-size: 12px;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 10px;
        }

        .badge.compra { background: rgba(102, 126, 234, 0.2); color: #a6b1ff; }
        .badge.venda { background: rgba(167, 139, 250, 0.2); color: #c4b5fd; }
        .badge.hold { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }
        .badge.ganho { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
        .badge.perda { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }

        .par-txt {
            font-size: 13px;
            color: #8a8f98;
        }

        .vazio {
            text-align: center;
            color: #666;
            padding: 60px 20px;
            font-size: 14px;
        }

        .refresh-note {
            text-align: center;
            font-size: 11px;
            color: #555;
            padding: 12px;
        }
    </style>
</head>
<body>
    <header>
        <div class="titulo">💭 Conversa com a IA</div>
        <div class="saldo" id="saldoTopo">-- EUR</div>
    </header>
    <div class="status" id="statusLinha">A carregar...</div>
    <div class="feed" id="feed">
        <div class="vazio">A carregar conversa...</div>
    </div>
    <div class="refresh-note">Atualiza automaticamente a cada 3s · última: <span id="hora">--:--:--</span></div>

    <script>
        function escapeHtml(texto) {
            const div = document.createElement('div');
            div.textContent = texto == null ? '' : String(texto);
            return div.innerHTML;
        }

        function classificaAcao(acao) {
            const a = (acao || '').toLowerCase();
            if (/vend|sair|fechar/.test(a)) return 'venda';
            if (/^hold$|manter|aguardar|esperar|^nada$/.test(a)) return 'hold';
            return 'compra';
        }

        async function carregar() {
            try {
                const resp = await fetch('./estado-Agente_1.json', { cache: 'no-store' });
                if (!resp.ok) return;
                const state = await resp.json();
                render(state);
            } catch {
                document.getElementById('statusLinha').textContent = 'Sem ligação ao agente...';
            }
        }

        function render(state) {
            const saldo = Number(state.saldo || 0);
            document.getElementById('saldoTopo').textContent = saldo.toFixed(2) + ' EUR';

            const ciclos = (state.ciclosHistorico || []).slice().reverse();
            document.getElementById('statusLinha').textContent =
                ciclos.length + ' ciclo(s) registados · patrimonio: ' +
                (ciclos.length ? Number(ciclos[0].patrimonioApos).toFixed(2) : saldo.toFixed(2)) + ' EUR';

            if (ciclos.length === 0) {
                document.getElementById('feed').innerHTML = '<div class="vazio">Ainda sem conversas — o primeiro ciclo está a decorrer...</div>';
            } else {
                let html = '';
                ciclos.forEach(c => {
                    const hora = c.timestamp ? new Date(c.timestamp).toLocaleString('pt-PT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
                    const tipo = classificaAcao(c.acao);
                    const temResultado = c.resultado !== null && c.resultado !== undefined;
                    const ganhoPositivo = Number(c.ganho) > 0;

                    let badges = `<span class="badge ${tipo}">${escapeHtml((c.acao || 'hold').toUpperCase())}</span>`;
                    if (c.par) badges += `<span class="par-txt">${escapeHtml(c.par)}</span>`;
                    if (temResultado) {
                        badges += `<span class="badge ${ganhoPositivo ? 'ganho' : 'perda'}">${ganhoPositivo ? '+' : ''}${Number(c.ganho).toFixed(2)} EUR (${c.resultado}%)</span>`;
                    }
                    if (c.posicoesFechadasAutomaticamente && c.posicoesFechadasAutomaticamente.length > 0) {
                        c.posicoesFechadasAutomaticamente.forEach(f => {
                            const win = Number(f.ganho) > 0;
                            badges += `<span class="badge ${win ? 'ganho' : 'perda'}">AUTO ${escapeHtml(f.par)}: ${win ? '+' : ''}${Number(f.ganho).toFixed(2)} EUR</span>`;
                        });
                    }

                    html += `
                        <div class="ciclo">
                            <div class="ciclo-header">
                                <span class="n">Ciclo #${c.ciclo}</span>
                                <span>${hora}</span>
                            </div>
                            <div class="pensamento">${escapeHtml(c.raciocinio || '(sem pensamento registado)')}</div>
                            <div class="decisao">${badges}</div>
                        </div>
                    `;
                });
                document.getElementById('feed').innerHTML = html;
            }

            document.getElementById('hora').textContent = new Date().toLocaleTimeString('pt-PT');
        }

        carregar();
        setInterval(carregar, 3000);
    </script>
</body>
</html>
